# Denkwerk in de cloud: clip-plannen, scripts en concepten. De live site heeft
# geen Claude-CLI (en bewust geen API-key, zodat alles op het abonnement
# draait). De site zet opdrachten in ai_jobs; deze workflow voert ze uit.
# Draait ook de kanaalcheck: nieuwe uploads worden zelf opgehaald.
name: ai-jobs

on:
  schedule:
    - cron: '0 * * * *' # uurcheck als vangnet; de app start zelf een run zodra er werk is
    - cron: '0 6 * * *' # dagelijkse kanaalcheck op nieuwe uploads
  workflow_dispatch:

# Eén run tegelijk. Een tweede run wacht netjes; annuleren zou een opdracht
# halverwege afbreken en op 'bezig' laten staan.
concurrency:
  group: ai-jobs
  cancel-in-progress: false

jobs:
  denken:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_BACKEND: claude-code
      CLAUDE_MODEL: claude-opus-5
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WHISPER_LOKAAL_MODEL: small
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Installeer yt-dlp (kanaalcheck en transcripten)
        run: |
          sudo curl -sSL --retry 3 --max-time 120 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      - name: Installeer deno (challenge-solver voor yt-dlp)
        run: |
          curl -fsSL --retry 3 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          sudo unzip -oq /tmp/deno.zip -d /usr/local/bin
          deno --version | head -1

      - name: Installeer ffmpeg (audio voor transcriptie)
        run: |
          if which ffmpeg; then ffmpeg -version | head -1
          else sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; fi

      # pip's wheel-cache bewaren tussen runs — bij een cache-miss gewoon een
      # normale install, alleen sneller bij een hit.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ai-jobs-${{ runner.os }}

      # Transcriberen zonder API-key: faster-whisper draait lokaal op de
      # runner. gdown haalt b-roll uit gedeelde Drive-mappen op.
      - name: Installeer faster-whisper en gdown
        run: pip3 install --quiet faster-whisper gdown

      - name: Dependencies
        run: npm ci

      - name: YouTube-cookies (optioneel)
        if: ${{ env.YTDLP_COOKIES_B64 != '' }}
        run: |
          echo "$YTDLP_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      # Eerst nieuwe bronvideo's ophalen (die zetten zelf plan-opdrachten klaar),
      # daarna alle wachtende denkopdrachten uitvoeren.
      - name: Nieuwe uploads van campagnekanalen ophalen
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/job.ts kanaal

      - name: Wachtende denkopdrachten uitvoeren
        run: npx tsx scripts/ai-worker.ts
