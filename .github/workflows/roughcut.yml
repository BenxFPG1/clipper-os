# Ruwe montages maken in de cloud. De live site kan dit niet zelf: video
# verwerken vraagt ffmpeg en minuten rekentijd, en serverless heeft geen van
# beide. De site zet een opdracht in render_jobs; deze workflow pakt hem op.
name: roughcut

on:
  schedule:
    - cron: '*/15 * * * *' # kwartiercheck op wachtende opdrachten
  workflow_dispatch:

concurrency:
  group: roughcut
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installeer ffmpeg
        run: |
          if which ffmpeg; then ffmpeg -version | head -1
          else
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
            which ffmpeg && ffmpeg -version | head -1
          fi

      - name: Installeer yt-dlp
        run: |
          sudo curl -sSL --retry 3 --max-time 120 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      # yt-dlp heeft een JS-runtime nodig om YouTube's n-challenge op te
      # lossen; zonder krijg je "Only images are available for download".
      - name: Installeer deno (challenge-solver voor yt-dlp)
        run: |
          curl -fsSL --retry 3 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          sudo unzip -oq /tmp/deno.zip -d /usr/local/bin
          deno --version | head -1

      # Gezichtsdetectie voor het kadreren van de verticale uitsnede.
      - name: Installeer OpenCV en faster-whisper
        run: pip3 install --quiet opencv-python-headless faster-whisper

      - name: Dependencies
        run: npm ci

      # Zonder cookies weigert YouTube het downloaden vanaf datacenter-IP's.
      - name: YouTube-cookies (optioneel)
        if: ${{ env.YTDLP_COOKIES_B64 != '' }}
        run: |
          echo "$YTDLP_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      - name: Wachtende montages verwerken
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/render-worker.ts
