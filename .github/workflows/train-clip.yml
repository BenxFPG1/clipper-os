# Eén trainingsronde voor één clip: het fragment opnieuw plannen met de
# huidige regels en de clip meteen renderen, op één machine (scripts/
# train-clip.ts). Een ronde via ai-jobs + roughcut kostte ~30 min, waarvan
# het meeste opzetten (twee keer), wachten en OpenCV/Whisper installeren.
name: train-clip

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Video-id'
        required: true
      van:
        description: 'Begin van het fragment (bronseconden)'
        required: true
      tot:
        description: 'Einde van het fragment (bronseconden)'
        required: true
      titel:
        description: 'Titel van de render'
        required: true
        default: 'TRAIN'
      modus:
        description: 'Leeg = opnieuw plannen; herbruik = laatste plan opnieuw monteren'
        required: false
        default: ''

concurrency:
  group: train-clip
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_BACKEND: claude-code
      CLAUDE_MODEL: claude-opus-5
      CLAUDE_LICHT_MODEL: claude-sonnet-5
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # De hele Python-omgeving bewaren (niet alleen de downloads): bij een
      # treffer hoeft er niets geïnstalleerd te worden. pip install van OpenCV
      # en faster-whisper kostte anders 3,4 min per run.
      - id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-train-${{ runner.os }}-py312-opencv5-fw1.2.1-av18-gdown6.4.2

      - name: Python-omgeving (alleen bij een lege cache)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install --quiet "opencv-python-headless<5" "numpy<2.3" "faster-whisper==1.2.1" "av==18.0.0" "gdown==6.4.2"

      - name: Python-omgeving op het pad
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "PYTHON_BIN=$HOME/venv/bin/python3" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-${{ runner.os }}-v1

      - name: Installeer ffmpeg
        run: |
          if which ffmpeg; then ffmpeg -version | head -1
          else
            for poging in 1 2 3; do
              if timeout 180 sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                && timeout 300 sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg; then
                break
              fi
              echo "apt-poging $poging mislukt of hing; opnieuw"
              sleep 10
            done
            which ffmpeg && ffmpeg -version | head -1
          fi

      - name: Installeer yt-dlp en deno
        run: |
          sudo curl -sSL --retry 3 --max-time 120 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          curl -fsSL --retry 3 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          sudo unzip -oq /tmp/deno.zip -d /usr/local/bin

      - name: Installeer Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Dependencies
        run: npm ci

      - name: YouTube-cookies (optioneel)
        if: ${{ env.YTDLP_COOKIES_B64 != '' }}
        run: |
          echo "$YTDLP_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      - name: Plannen en renderen
        env:
          VIDEO: ${{ inputs.video }}
          VAN: ${{ inputs.van }}
          TOT: ${{ inputs.tot }}
          TITEL: ${{ inputs.titel }}
          MODUS: ${{ inputs.modus }}
        run: npx tsx scripts/train-clip.ts "$VIDEO" "$VAN" "$TOT" "$TITEL" "$MODUS"
