# Achtergrondtaken in de cloud, zonder Mac en zonder API-credits:
# de LLM-stappen lopen via de Claude Code CLI met een abonnements-token
# (`claude setup-token` -> secret CLAUDE_CODE_OAUTH_TOKEN).
#
# Tijden staan in UTC. Nederlandse zomertijd = UTC+2 (winter +1); een uurtje
# verschuiven per seizoen maakt voor deze taken niets uit.
name: clipper-jobs

on:
  schedule:
    - cron: '15 0,6,12,18 * * *' # tracking: 4x per dag
    - cron: '30 5,14 * * *'      # scout: 2x per dag (~7:30 en ~16:30 NL)
    - cron: '30 7 * * 0'         # retro: zondag ~9:30 NL
    - cron: '0 9 * * 1'          # kennis: maandag ~11:00 NL
    - cron: '20 * * * *'         # cliparmy: elk uur nieuwe campagnes ophalen
    - cron: '0 10 * * 2,4,6'     # kijken: di/do/za, topvondsten visueel analyseren
    - cron: '0 9 * * *'          # editleraar: dagelijks, leren van edit-tutorials
    - cron: '30 10 * * 0'        # editleraar_visueel: zondag, toffe effecten spotten in topvondsten
    - cron: '0 6,15 * * *'       # trends: 2x per dag, net na elke scout-run (~7:30/16:30 NL) — slaat zichzelf over zonder genoeg nieuwe vondsten
    - cron: '0 12 * * 0'         # consolideer: zondag ~14:00 NL, bijna-duplicaten in vault_kennis samenvoegen
    - cron: '40 3 * * *'         # render_vingerafdruk: dagelijks ~5:40 NL, eigen renders meetbaar maken (max 10 per run)
    - cron: '10 4 * * *'         # smaak: dagelijks ~6:10 NL, lessen uit eigen oordelen + cijfers (slaat over bij < 5 nieuwe)
    - cron: '45 16 * * *'        # vingerafdruk: dagelijks ~18:45 NL, na de middag-scout: top- en basislijnposts meten + edit-normen herberekenen
  workflow_dispatch:
    inputs:
      job:
        description: 'Welke taak'
        required: true
        type: choice
        options: [tracking, scout, retro, kennis, kanaal, cliparmy, kijken, editleraar, editleraar_visueel, trends, consolideer, smaak, render_vingerafdruk, vingerafdruk, diag]

concurrency:
  group: clipper-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - name: Bepaal taak uit trigger
        id: kies
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5,14 * * *" ]; then
            echo "job=scout" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * 0" ]; then
            echo "job=retro" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            echo "job=kennis" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 * * * *" ]; then
            echo "job=cliparmy" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 2,4,6" ]; then
            echo "job=kijken" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "job=editleraar" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 10 * * 0" ]; then
            echo "job=editleraar_visueel" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6,15 * * *" ]; then
            echo "job=trends" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 0" ]; then
            echo "job=consolideer" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 3 * * *" ]; then
            echo "job=render_vingerafdruk" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 4 * * *" ]; then
            echo "job=smaak" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
            echo "job=vingerafdruk" >> "$GITHUB_OUTPUT"
          else
            echo "job=tracking" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # yt-dlp en ffmpeg halen we als kant-en-klare binaries op: apt-get bleek
      # minutenlang te kunnen hangen op de runner. ffmpeg stond vroeger al op
      # de runner-image, maar is er stilzwijgend uit verdwenen — de oude check
      # (`ffmpeg -version | head -1`) faalde niet omdat de pipe het verborg,
      # en kijken/editleraar_visueel liepen wekenlang op "spawn ffmpeg ENOENT".
      # Nu: gebruiken wat er is, anders de statische build, en hard falen als
      # het dan nog ontbreekt.
      - name: Installeer yt-dlp en ffmpeg
        if: ${{ steps.kies.outputs.job != 'cliparmy' && steps.kies.outputs.job != 'consolideer' }}
        run: |
          sudo curl -sSL --retry 3 --max-time 120 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            curl -fsSL --retry 3 --max-time 180 \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            sudo install -m 755 /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          fi
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null

      # Zonder dit lost yt-dlp YouTube's n-challenge niet op: downloads en
      # ondertitels falen dan stil (geen harde fout, gewoon geen bestanden).
      # Precies wat editleraar elke geplande run trof — "geen tutorials met
      # bruikbare ondertiteling gevonden" was in werkelijkheid deze
      # ontbrekende stap, niet een probleem met de zoek- of leeslogica.
      - name: Installeer deno (challenge-solver voor yt-dlp)
        if: ${{ steps.kies.outputs.job != 'cliparmy' && steps.kies.outputs.job != 'consolideer' }}
        run: |
          curl -fsSL --retry 3 https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          sudo unzip -oq /tmp/deno.zip -d /usr/local/bin
          deno --version | head -1

      - name: Dependencies
        run: npm ci

      # Spreektempo in de vingerafdruk: gratis lokaal transcriberen. Zonder
      # dit (en zonder Groq-key) blijft woordenPerS leeg — de rest van de
      # meting werkt gewoon. Model 'base' via WHISPER_LOKAAL_MODEL hieronder:
      # voor woorden tellen genoeg, en een fractie van de tijd van 'small'.
      - name: faster-whisper (vingerafdruk)
        if: ${{ steps.kies.outputs.job == 'vingerafdruk' }}
        run: pip3 install --quiet faster-whisper

      # Ook nodig voor cliparmy: een binnengehaalde campagne wordt door de
      # import-agent gelezen.
      - name: Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Optioneel: YouTube-cookies voor de bot-check (base64 van een cookies.txt).
      # Zonder dit secret werkt TikTok meestal wel en kan YouTube-research
      # geweigerd worden; de scout logt dat dan als fout per bron en gaat door.
      - name: YouTube-cookies (optioneel)
        if: ${{ steps.kies.outputs.job != 'cliparmy' && env.YTDLP_COOKIES_B64 != '' }}
        run: |
          echo "$YTDLP_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      # Diagnose: toont alleen de VORM van de token (prefix + lengte), nooit de
      # inhoud, en doet één kale CLI-call zodat de echte foutmelding zichtbaar is.
      - name: Diagnose abonnements-token
        if: ${{ steps.kies.outputs.job == 'diag' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "prefix: $(echo "$CLAUDE_CODE_OAUTH_TOKEN" | cut -c1-11)…  lengte: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo 'Zeg alleen: OK' | claude -p --output-format json --model claude-opus-5 --effort low --no-session-persistence || true

      - name: Draai ${{ steps.kies.outputs.job }}
        if: ${{ steps.kies.outputs.job != 'diag' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_BACKEND: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-opus-5
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Eigen ClipArmy-account, zodat het uurlijks ophalen zelf inlogt in
          # plaats van te leunen op een token dat na een uur verloopt.
          CLIPARMY_EMAIL: ${{ secrets.CLIPARMY_EMAIL }}
          CLIPARMY_WACHTWOORD: ${{ secrets.CLIPARMY_WACHTWOORD }}
          COST_ALERT_EUR: '20'
          WHISPER_LOKAAL_MODEL: base
          # Voor render_vingerafdruk: de eigen renders staan in R2.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npx tsx scripts/job.ts ${{ steps.kies.outputs.job }}
